name: Deploy HEOA to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Check exported homepage
        run: test -s pages/index.html && test -s pages/team/index.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: pages
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
